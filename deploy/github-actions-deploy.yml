# ============================================================================
# Copy this file to `.github/workflows/deploy.yml` to activate it.
#
# It lives here rather than in `.github/workflows/` because the GitHub App used
# by this workspace is not granted the `workflows` permission, so commits that
# create or edit workflow files are rejected on push:
#   "refusing to allow a GitHub App to create or update workflow ... without
#    `workflows` permission"
# Copying it in the GitHub UI, or from a clone pushed with your own credentials,
# takes one step and needs no repository setting.
# ============================================================================
name: Deploy to Cloudflare

# The deployed Worker can fail with "The platform database is not initialised
# yet" because the message is about the *database*, not the upload: the Worker
# is live, but its D1 database never had the migrations applied. This workflow
# makes the two steps a single operation, in the right order, on every push to
# main.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   Workers Scripts:Edit + D1:Edit for the account
#   CLOUDFLARE_ACCOUNT_ID  shown in the Cloudflare dashboard URL
#
# Database name and id are read from wrangler.jsonc, so the workflow carries no
# duplicate configuration. Vars, routes and bindings are deployed as declared
# there too.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint and unit tests
        run: |
          npm run typecheck
          npm run lint
          npm test

      # Before the upload: a new Worker version may expect columns that do not
      # exist yet, and D1 migrations are additive and idempotent.
      - name: Apply D1 migrations (remote)
        run: npx wrangler d1 migrations apply DB --remote

      - name: Build and deploy the Worker
        run: npm run deploy

      # Proves the deployment can actually read its database, instead of
      # discovering it in a user's browser.
      - name: Smoke-test the deployment
        run: |
          base="$(node scripts/print-app-base-url.mjs)"
          url="${base%/}/api/health"
          echo "Checking $url"
          for attempt in 1 2 3 4 5; do
            body="$(curl -fsS "$url" 2>/dev/null || true)"
            if printf '%s' "$body" | grep -q '"schemaReady":true'; then
              printf '%s\n' "$body"
              exit 0
            fi
            echo "attempt ${attempt}: ${body:-no response}"
            sleep 10
          done
          echo "::error::The deployed Worker cannot reach an initialised database. Check the D1 binding and the migrations step."
          exit 1
