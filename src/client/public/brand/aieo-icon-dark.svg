<?xml version="1.0" encoding="UTF-8"?>
<!--
  Ai eo — app icon, for dark surfaces: the mark on a slate squircle.
  The mark: three rounded bars, the shortest one an "i" with its dot above.
  Drawn as plain shapes — no font, no filter — so nothing depends on what is
  installed on the machine showing it.
  No affiliation with IELTS, British Council, IDP or Cambridge.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Ai eo">
  <title>Ai eo</title>
  <rect width="64" height="64" rx="16" fill="#0F172A"/>
  <rect x="12" y="32" width="9" height="20" rx="4.5" fill="#FF4D4D"/>
  <circle cx="16.5" cy="21" r="4.5" fill="#FF4D4D"/>
  <rect x="27.5" y="12" width="9" height="40" rx="4.5" fill="#FF4D4D"/>
  <rect x="43" y="22" width="9" height="30" rx="4.5" fill="#FF4D4D"/>
</svg>
